# Integración continua: linter, pruebas, revisión de dependencias y
# construcción de las imágenes en cada cambio (sección de Construcción del
# Capítulo 3).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pimau_test
          POSTGRES_USER: pimau
          POSTGRES_PASSWORD: pimau
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pimau -d pimau_test"
          --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_PRUEBAS: postgresql+psycopg://pimau:pimau@localhost:5432/pimau_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Linter (Ruff, PEP 8)
        run: ruff check .
      - name: Pruebas unitarias y de integración
        run: pytest -q
      - name: Revisión de dependencias vulnerables
        run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Linter (ESLint)
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Revisión de dependencias vulnerables
        run: npm audit --audit-level=high
      - name: Construcción
        run: npm run build

  imagenes:
    # Construye las imágenes de los contenedores para comprobar que se pueden
    # desplegar.
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
