# Integración continua: linter, pruebas, revisión de dependencias y
# construcción de las imágenes en cada cambio (sección de Construcción del
# Capítulo 3).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pimau_test
          POSTGRES_USER: pimau
          POSTGRES_PASSWORD: pimau
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pimau -d pimau_test"
          --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_PRUEBAS: postgresql+psycopg://pimau:pimau@localhost:5432/pimau_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Linter (Ruff, PEP 8)
        run: ruff check .
      - name: Pruebas unitarias y de integración
        run: pytest -q
      - name: Revisión de dependencias vulnerables
        run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Linter (ESLint)
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Revisión de dependencias vulnerables
        run: npm audit --audit-level=high
      - name: Construcción
        run: npm run build

  e2e:
    # Pruebas de extremo a extremo y de accesibilidad (RNF-07) del visor contra
    # el build de producción, con la API simulada de web/e2e: no necesitan el
    # backend ni el mapa base. El informe guarda una captura de cada vista.
    runs-on: ubuntu-latest
    needs: [web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Navegador de las pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo y de accesibilidad
        run: npm run e2e
      - name: Informe con las capturas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: informe-e2e
          path: web/playwright-report/
          retention-days: 14

  imagenes:
    # Construye las imágenes de los contenedores para comprobar que se pueden
    # desplegar.
    runs-on: ubuntu-latest
    needs: [backend, web, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      # El descargador corre con el Python de la imagen de Playwright (3.10),
      # distinto del de las pruebas (3.12): se comprueba que su código carga ahí.
      - name: El descargador de SATIC carga en su imagen
        run: docker compose run --rm --no-deps descarga-satic python -c "import pimau.ingesta.descarga_satic"
