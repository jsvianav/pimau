server {
  listen 80;
  root /usr/share/nginx/html;

  # Se vuelve a consultar la dirección de la API cada 10 segundos en el DNS
  # interno de Docker, para que siga funcionando cuando el contenedor de la
  # API se recrea con otra dirección.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;

  # Compresión. La imagen de nginx la trae apagada, así que el mapa (MapLibre,
  # cerca de 1 MB), las gráficas, React y las capas de la IDESC viajaban sin
  # comprimir. Con gzip el código del visor pesa la cuarta parte. Incluye las
  # respuestas de la API (gzip_proxied).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css text/plain text/csv application/javascript application/json application/geo+json image/svg+xml;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    # Se reemplaza (no se agrega) la IP del cliente, para que nadie pueda
    # enviar una cabecera inventada y saltarse el límite de solicitudes.
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Los archivos de assets/ llevan un código de versión en el nombre, así que
  # se pueden guardar en caché. La página principal no, para que el navegador
  # siempre reciba la versión nueva después de un despliegue.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
