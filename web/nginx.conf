server {
  listen 80;
  root /usr/share/nginx/html;

  # Se vuelve a consultar la dirección de la API cada 10 segundos en el DNS
  # interno de Docker, para que siga funcionando cuando el contenedor de la
  # API se recrea con otra dirección.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Los archivos de assets/ llevan un código de versión en el nombre, así que
  # se pueden guardar en caché. La página principal no, para que el navegador
  # siempre reciba la versión nueva después de un despliegue.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
