# PIMAU - Plataforma Inteligente de Monitoreo Ambiental Urbano
# Contenedores de las capas del ADR-01: almacenamiento (db), ingesta,
# servicios (api) y presentación (web).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin puerto publicado: solo los demás contenedores llegan a la base, por
    # la red interna de Docker (análisis de amenazas del Capítulo 3).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  ingesta:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
    volumes:
      # Bandeja de los archivos exportados de SATIC (ver docs/bitacora.md).
      - ./data/satic:/datos/satic:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m pimau.ingesta programador"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "pimau.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "8000:8000"

  # Respaldo diario de la base de datos (Construcción, Capítulo 3, y ADR-01).
  # Guarda un archivo por día en ./respaldos y conserva los últimos 7.
  respaldo:
    image: postgis/postgis:16-3.4
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./respaldos:/respaldos
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/respaldo.sh"]
    configs:
      - source: respaldo
        target: /scripts/respaldo.sh

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:

configs:
  respaldo:
    file: ./scripts/respaldo.sh
